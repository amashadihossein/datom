# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE ON PATH FILTERING: `ubuntu-latest (release)` is a *required* status check
# in branch protection. Workflow-level `paths-ignore` would make this job skip on
# doc-only PRs, and a skipped required check stays "Expected" forever and blocks
# the merge. So instead of skipping the workflow, we always run the required job
# and gate the heavy steps on whether code actually changed (the `changes` job).
# On a doc-only change the job still runs and reports success -- truthfully, since
# there is nothing to check -- so the required context is satisfied without a
# separate "dummy" workflow (which would risk masking a real failure on mixed
# code+doc PRs).
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!vignettes/**'
              - '!inst/vignette-setup/**'
              - '!README.md'
              - '!README.Rmd'
              - '!NEWS.md'
              - '!_pkgdown.yml'
              - '!docs/**'
              - '!dev/**'
              - '!man/figures/**'

  R-CMD-check:
    needs: changes
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # ubuntu-latest (devel) restored for the CRAN submission window
          # (CRAN incoming checks run R-devel). Note: no R-devel Linux
          # binaries on Posit PPM, so this job pays a 15-25 min source-
          # compile tax for arrow + paws.storage + friends on every PR.
          # It can be re-disabled after the release is on CRAN if the
          # cost outweighs the early-warning value.
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Skip notice (docs-only change)
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change; nothing for R CMD check to verify. Reporting required context as passed."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'

      - uses: r-lib/actions/setup-pandoc@v2
        if: needs.changes.outputs.code == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: needs.changes.outputs.code == 'true'
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: needs.changes.outputs.code == 'true'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Test fixtures build throwaway git repos, and git2r honours
      # init.defaultBranch when naming the first branch. A fixture that
      # hardcodes a branch name passes wherever the runner default matches and
      # fails everywhere else -- which is how #106 reached CRAN, failing on four
      # Linux flavors while every other flavor was OK. Runners default to
      # `master`, so pinning `main` on this one leg (a required status check)
      # exercises the other value at no extra CI cost; the remaining legs keep
      # the default, so both names stay covered.
      - name: Pin a non-default git branch name (regression guard for #106)
        if: needs.changes.outputs.code == 'true' && matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: git config --global init.defaultBranch main

      - uses: r-lib/actions/check-r-package@v2
        if: needs.changes.outputs.code == 'true'
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
