<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 181.93 210">
  <!-- Hex background -->
  <polygon fill="#0D1B2A" points="90.965,0 181.93,52.5 181.93,157.5 90.965,210 0,157.5 0,52.5"/>
  <!-- Hex border -->
  <polygon points="90.965,3 178.93,54.5 178.93,155.5 90.965,207 3,155.5 3,54.5" fill="none" stroke="#AAAAAA" stroke-width="2.5"/>

  <!-- Atom orbits -->
  <g transform="translate(91, 88)">
    <ellipse cx="0" cy="0" rx="56" ry="22" fill="none" stroke="#777777" stroke-width="0.8"/>
    <ellipse cx="0" cy="0" rx="56" ry="22" fill="none" stroke="#777777" stroke-width="0.8" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="56" ry="22" fill="none" stroke="#777777" stroke-width="0.8" transform="rotate(-60)"/>

    <!-- Electron 1: right tip -->
    <circle cx="56" cy="0" r="5.5" fill="#FFFFFF"/>
    <text x="56" y="0" text-anchor="middle" dominant-baseline="central" font-family="'Consolas',monospace" font-size="7" font-weight="700" fill="#0D1B2A">1</text>

    <!-- Electron 2: upper-left tip -->
    <circle cx="-28" cy="-48.5" r="5.5" fill="#FFFFFF"/>
    <text x="-28" y="-48.5" text-anchor="middle" dominant-baseline="central" font-family="'Consolas',monospace" font-size="7" font-weight="700" fill="#0D1B2A">0</text>

    <!-- Electron 3: lower-left tip -->
    <circle cx="-28" cy="48.5" r="5.5" fill="#FFFFFF"/>
    <text x="-28" y="48.5" text-anchor="middle" dominant-baseline="central" font-family="'Consolas',monospace" font-size="7" font-weight="700" fill="#0D1B2A">1</text>

    <!-- Nucleus: Data table -->
    <g transform="translate(-14, -12)">
      <rect x="0" y="0" width="28" height="24" rx="2" fill="#0D1B2A" stroke-width="1.5"/>
      <rect x="0" y="0" width="28" height="24" rx="2" fill="none" stroke="#AAAAAA" stroke-width="1.5"/>
      <rect x="0" y="0" width="28" height="7" rx="2" fill="#FFFFFF" opacity="0.15"/>
      <rect x="0" y="5" width="28" height="2" fill="#FFFFFF" opacity="0.15"/>
      <line x1="9.3" y1="0" x2="9.3" y2="24" stroke="#AAAAAA" stroke-width="0.6" opacity="0.5"/>
      <line x1="18.6" y1="0" x2="18.6" y2="24" stroke="#AAAAAA" stroke-width="0.6" opacity="0.5"/>
      <line x1="0" y1="7" x2="28" y2="7" stroke="#AAAAAA" stroke-width="0.6" opacity="0.5"/>
      <line x1="0" y1="12.7" x2="28" y2="12.7" stroke="#AAAAAA" stroke-width="0.4" opacity="0.3"/>
      <line x1="0" y1="18.3" x2="28" y2="18.3" stroke="#AAAAAA" stroke-width="0.4" opacity="0.3"/>
    </g>
  </g>

  <!-- "datom" text -->
  <text x="91" y="172" text-anchor="middle" font-family="'Consolas',monospace" font-size="28" font-weight="600" letter-spacing="2">
    <tspan fill="#FFFFFF" opacity="0.6">d</tspan><tspan fill="#FFFFFF">atom</tspan>
  </text>
</svg>
